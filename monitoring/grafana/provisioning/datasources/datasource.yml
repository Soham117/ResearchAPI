# ──────────────────────────────────────────────────────────────
# Grafana Datasource Auto-Provisioning
# Registers Prometheus as the default datasource on first boot.
# ──────────────────────────────────────────────────────────────

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "1s"
      httpMethod: POST
